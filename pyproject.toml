[project]
name = "youshop-radar"
version = "0.1.0"
description = "Servidor MCP somente leitura para deteccao preventiva de risco de produtores na YouShop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=30.0.0",
    "groq>=0.13.0",
    "mcp[cli]>=1.2.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youshop_radar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
