name: CI — YouShop Radar MCP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint com ruff
        run: uv run ruff check src tests demo_client

      - name: Testes automatizados com pytest
        run: uv run pytest -v